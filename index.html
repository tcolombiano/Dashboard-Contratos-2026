        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: #f5f3ff;
            color: #2d1b4e;
            padding: 20px;
        }
        :root {
            --purple-900: #2d1b4e;
            --purple-700: #5b3e8a;
            --purple-500: #8b6fc9;
            --purple-300: #c4b0e6;
            --purple-100: #ede7f6;
            --yellow: #fbbf24;
            --orange: #f97316;
            --red: #ef4444;
            --green: #22c55e;
            --gray: #9ca3af;
        }
        .dashboard {
            max-width: 1400px;
            margin: 0 auto;
        }
        h1 {
            font-size: 2rem;
            color: var(--purple-900);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .subtitle {
            color: var(--purple-700);
            margin-bottom: 30px;
            font-weight: 300;
        }
        .tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 30px;
            border-bottom: 2px solid var(--purple-300);
            padding-bottom: 10px;
        }
        .tab-btn {
            background: transparent;
            border: none;
            padding: 10px 24px;
            font-size: 1rem;
            font-weight: 600;
            color: var(--purple-700);
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .tab-btn:hover {
            background: var(--purple-100);
        }
        .tab-btn.active {
            background: var(--purple-900);
            color: #fff;
        }
        .tab-content {
            display: none;
            animation: fade 0.3s;
        }
        .tab-content.active {
            display: block;
        }
        @keyframes fade {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .filter-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 25px;
            align-items: center;
        }
        .filter-bar label {
            font-weight: 600;
            color: var(--purple-700);
        }
        .filter-btn {
            background: white;
            border: 1px solid var(--purple-300);
            padding: 6px 16px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.9rem;
        }
        .filter-btn:hover {
            background: var(--purple-100);
        }
        .filter-btn.active-filter {
            background: var(--purple-900);
            color: white;
            border-color: var(--purple-900);
        }
        .contract-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 18px;
        }
        .contract-card {
            background: white;
            border-radius: 16px;
            padding: 18px 20px;
            box-shadow: 0 4px 12px rgba(45, 27, 78, 0.08);
            border-left: 6px solid var(--gray);
            transition: transform 0.1s, box-shadow 0.2s;
            position: relative;
        }
        .contract-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(45, 27, 78, 0.15);
        }
        .contract-card .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 8px;
        }
        .contract-card .title {
            font-weight: 700;
            font-size: 1rem;
            color: var(--purple-900);
        }
        .contract-card .empresa {
            font-size: 0.85rem;
            color: var(--purple-700);
            background: var(--purple-100);
            padding: 2px 12px;
            border-radius: 30px;
        }
        .contract-card .detalhes {
            font-size: 0.85rem;
            color: #374151;
            margin: 8px 0;
            line-height: 1.5;
        }
        .contract-card .detalhes strong {
            color: var(--purple-900);
        }
        .contract-card .badge {
            display: inline-block;
            padding: 3px 12px;
            border-radius: 30px;
            font-size: 0.75rem;
            font-weight: 600;
            margin-top: 6px;
        }
        .badge-vencido {
            background: #fecaca;
            color: #991b1b;
        }
        .badge-6 {
            background: #fde68a;
            color: #92400e;
        }
        .badge-4 {
            background: #fdba74;
            color: #9a3412;
        }
        .badge-2 {
            background: #fca5a5;
            color: #991b1b;
        }
        .badge-vigente {
            background: #bbf7d0;
            color: #166534;
        }
        .contract-card .footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 12px;
            font-size: 0.8rem;
            color: var(--purple-700);
            border-top: 1px solid #e5e7eb;
            padding-top: 10px;
        }
        .btn-detalhes {
            background: var(--purple-100);
            border: none;
            padding: 4px 14px;
            border-radius: 30px;
            color: var(--purple-900);
            font-weight: 600;
            cursor: pointer;
            font-size: 0.75rem;
            transition: 0.2s;
        }
        .btn-detalhes:hover {
            background: var(--purple-300);
        }
        .processo-sei {
            background: #f3f4f6;
            padding: 2px 10px;
            border-radius: 30px;
            font-family: monospace;
            font-size: 0.7rem;
            color: #1f2937;
            display: inline-block;
        }
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }
        .modal-overlay.open {
            display: flex;
        }
        .modal {
            background: white;
            border-radius: 24px;
            max-width: 800px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            position: relative;
        }
        .modal-close {
            position: sticky;
            top: 0;
            float: right;
            background: var(--purple-100);
            border: none;
            border-radius: 50%;
            width: 36px;
            height: 36px;
            font-size: 1.4rem;
            cursor: pointer;
            color: var(--purple-900);
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;

            background: var(--purple-300);
        }
        .modal h2 {
            color: var(--purple-900);
            margin-bottom: 15px;
        }

            background: #f9f8ff;
            border-radius: 12px;
            padding: 14px 18px;
            margin-bottom: 12px;
            border-left: 4px solid var(--purple-500);

            font-weight: 600;
            color: var(--purple-700);

            font-size: 0.9rem;
            color: #374151;
            margin-top: 4px;
        }

            background: var(--purple-100);
            padding: 8px 14px;
            border-radius: 30px;
            font-size: 0.8rem;
            display: inline-block;
            color: var(--purple-900);
            margin-top: 6px;

            border-radius: 30px;
            display: inline-block;
            font-size: 1.1rem;
            margin-bottom: 15px;

                { id: 106, id_termo: "2º TERMO-DA-CLAREON-033/2020", id_contrato: "DA-CLAREON-033/2020", n_termo: "2º", objeto: "Prestação dos serviços de manutenção preventiva, corretiva e de reparo, com reposição eventual de peças, acessórios e lubrificantes, condicionada esta à prévia aprovação de orçamento específico, na plataforma elevatória Junta Médica Oficial do Estado", processo: "009.0281.2022.0002201-67", valor_global: 5460, saldo: 5460, vig_ini: "2022-06-01", vig_fim: "2023-06-01", meses: 12 },
                { id: 107, id_termo: "3º TERMO-DA-CLAREON-033/2020", id_contrato: "DA-CLAREON-033/2020", n_termo: "3º", objeto: "Prestação dos serviços de manutenção preventiva, corretiva e de reparo, com reposição eventual de peças, acessórios e lubrificantes, condicionada esta à prévia aprovação de orçamento específico, na plataforma elevatória Junta Médica Oficial do Estado", processo: "009.0281.2023.0001106-72", valor_global: 5460, saldo: 5460, vig_ini: "2023-06-01", vig_fim: "2024-06-01", meses: 12 },
                { id: 108, id_termo: "4º TERMO-DA-CLAREON-033/2020", id_contrato: "DA-CLAREON-033/2020", n_termo: "4º", objeto: "Prestação dos serviços de manutenção preventiva, corretiva e de reparo, com reposição eventual de peças, acessórios e lubrificantes, condicionada esta à prévia aprovação de orçamento específico, na plataforma elevatória Junta Médica Oficial do Estado", processo: "009.0281.2024.0001481-58", valor_global: 4560, saldo: 4560, vig_ini: "2024-06-01", vig_fim: "2025-06-01", meses: 12 }
            ];

            console.log('Dados carregados:', contratos.length, 'contratos,', termos.length, 'termos');

            // ============================================================
            // FUNÇÕES AUXILIARES
            // ============================================================
            function getTermosPorContrato(idAgrupado) {
                return termos.filter(t => t.id_contrato === idAgrupado);
            }

            function getUltimaVigencia(contrato) {
                const termos = getTermosPorContrato(contrato.id_agrupado);
                let ultimaFim = contrato.vig_fim;
                let ultimaIni = contrato.vig_ini;
                if (termos.length) {
                    const sorted = [...termos].sort((a, b) => new Date(b.vig_fim) - new Date(a.vig_fim));
                    if (sorted.length > 0 && sorted[0].vig_fim) {
                        ultimaFim = sorted[0].vig_fim;
                        ultimaIni = sorted[0].vig_ini;
                    }
                }
                return { vig_ini: ultimaIni, vig_fim: ultimaFim };
            }

            function getStatus(contrato) {
                const hoje = new Date();
                hoje.setHours(0, 0, 0, 0);
                const fim = new Date(contrato.vig_fim);
                if (isNaN(fim.getTime())) return 'indefinido';
                const diffMeses = (fim.getFullYear() - hoje.getFullYear()) * 12 + (fim.getMonth() - hoje.getMonth());
                if (fim < hoje) return 'vencido';
                if (diffMeses <= 2) return '2';
                if (diffMeses <= 4) return '4';
                if (diffMeses <= 6) return '6';
                return 'vigente';
            }

            function getBadgeClass(status) {
                if (status === 'vencido') return 'badge-vencido';
                if (status === '2') return 'badge-2';
                if (status === '4') return 'badge-4';
                if (status === '6') return 'badge-6';
                return 'badge-vigente';
            }

            function getBadgeText(status) {
                if (status === 'vencido') return 'Vencido';
                if (status === '2') return '≤ 2 meses';
                if (status === '4') return '≤ 4 meses';
                if (status === '6') return '≤ 6 meses';
                return 'Vigente';
            }

            function getTema(objeto) {
                const txt = objeto.toLowerCase();
                if (txt.includes('água') || txt.includes('esgoto') || txt.includes('abastecimento')) return 'Concessionária';
                if (txt.includes('software') || txt.includes('firewall') || txt.includes('licença') || txt.includes('design') || txt.includes('tic')) return 'Tecnologia';
                if (txt.includes('telefonia') || txt.includes('comunicação') || txt.includes('sms') || txt.includes('dados')) return 'Telecomunicações';
                if (txt.includes('limpeza') || txt.includes('conservação') || txt.includes('manutenção') || txt.includes('extintor') || txt.includes('jardim')) return 'Serviços de Manutenção';
                if (txt.includes('vigilância') || txt.includes('segurança')) return 'Segurança';
                if (txt.includes('veículo') || txt.includes('locação') || txt.includes('frota') || txt.includes('telemetria')) return 'Transporte e Frota';
                if (txt.includes('jornal') || txt.includes('publicidade') || txt.includes('impressão') || txt.includes('clipping')) return 'Comunicação e Publicidade';
                if (txt.includes('recursos humanos') || txt.includes('pessoal') || txt.includes('estagiário')) return 'Recursos Humanos';
                if (txt.includes('energia') || txt.includes('elétrica') || txt.includes('coelba')) return 'Energia';
                return 'Outros';
            }

            // ============================================================
            // RENDERIZAÇÃO
            // ============================================================
            function renderContractCard(contrato, showProcesso = true) {
                const status = getStatus(contrato);
                const badgeClass = getBadgeClass(status);
                const badgeText = getBadgeText(status);
                const termosDoContrato = getTermosPorContrato(contrato.id_agrupado);
                const temAditivo = termosDoContrato.length > 0;
                const ultima = getUltimaVigencia(contrato);

                const card = document.createElement('div');
                card.className = 'contract-card';
                card.style.borderLeftColor = status === 'vencido' ? '#ef4444' : status === '2' ? '#ef4444' : status === '4' ? '#f97316' : status === '6' ? '#fbbf24' : '#22c55e';

                let html = `
                    <div class="header">
                        <span class="title">${contrato.empresa} - ${contrato.n_contrato}</span>
                        <span class="empresa">${contrato.unidade}</span>
                    </div>
                    <div class="detalhes">
                        <strong>Objeto:</strong> ${contrato.objeto || 'Não informado'}<br>
                        <strong>Vigência:</strong> ${ultima.vig_ini || 'N/A'} a ${ultima.vig_fim || 'N/A'}<br>
                        <strong>Saldo:</strong> R$ ${Number(contrato.saldo).toFixed(2)}<br>
                        ${showProcesso ? `<span class="processo-sei">SEI: ${contrato.processo || 'N/A'}</span>` : ''}
                        ${contrato.tratativa ? `<div class="tratativa">${contrato.tratativa}</div>` : ''}
                    </div>
                    <div>
                        <span class="badge ${badgeClass}">${badgeText}</span>
                        ${temAditivo ? `<span style="margin-left:8px;font-size:0.7rem;background:#e5e7eb;padding:2px 10px;border-radius:30px;">${termosDoContrato.length} aditivo(s)</span>` : ''}
                    </div>
                    <div class="footer">
                        <span>${contrato.id_agrupado}</span>
                        <button class="btn-detalhes" data-id="${contrato.id}">Histórico</button>
                    </div>
                `;
                card.innerHTML = html;
                return card;
            }

            function renderList(containerId, lista, showProcesso = true) {
                const container = document.getElementById(containerId);
                if (!container) return;
                container.innerHTML = '';
                if (lista.length === 0) {
                    container.innerHTML = '<div class="empty-state">Nenhum contrato encontrado.</div>';
                    return;
                }
                lista.forEach(contrato => {
                    const card = renderContractCard(contrato, showProcesso);
                    container.appendChild(card);
                });
            }

            function getMonthYearFilters() {
                const hoje = new Date();
                const meses = [];
                for (let i = 0; i < 12; i++) {
                    const data = new Date(hoje.getFullYear(), hoje.getMonth() + i, 1);
                    const label = data.toLocaleString('pt-BR', { month: 'long', year: 'numeric' });
                    const value = `${data.getFullYear()}-${String(data.getMonth()+1).padStart(2,'0')}`;
                    meses.push({ label, value });
                }
                return meses;
            }

            function renderMonthFilters() {
                const container = document.getElementById('monthFilters');
                if (!container) return;
                const filtros = getMonthYearFilters();
                let html = '<button class="filter-btn active-filter" data-filter="todos">Todos</button>';
                filtros.forEach(f => {
                    html += `<button class="filter-btn" data-filter="${f.value}">${f.label}</button>`;
                });
                container.innerHTML = html;
                container.querySelectorAll('.filter-btn').forEach(btn => {
                    btn.addEventListener('click', function() {
                        container.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active-filter'));
                        this.classList.add('active-filter');
                        const filter = this.dataset.filter;
                        aplicarFiltroVencimento(filter);
                    });
                });
            }

            function aplicarFiltroVencimento(filter) {
                const lista = contratos.filter(c => c.vig_fim && c.vig_fim !== '');
                if (filter !== 'todos') {
                    const [ano, mes] = filter.split('-').map(Number);
                    const filtered = lista.filter(c => {
                        const fim = new Date(c.vig_fim);
                        return fim.getFullYear() === ano && fim.getMonth() + 1 === mes;
                    });
                    renderList('vencimentoList', filtered);
                } else {
                    // Mostrar apenas contratos com vigência futura ou vencidos recentes
                    const hoje = new Date();
                    hoje.setHours(0,0,0,0);
                    const futuros = lista.filter(c => new Date(c.vig_fim) >= hoje);
                    renderList('vencimentoList', futuros);
                }
            }

            // Abas
            function initTabs() {
                const tabs = document.querySelectorAll('.tab-btn');
                tabs.forEach(tab => {
                    tab.addEventListener('click', function() {
                        tabs.forEach(t => t.classList.remove('active'));
                        this.classList.add('active');
                        const target = this.dataset.tab;
                        document.querySelectorAll('.tab-content').forEach(tc => tc.classList.remove('active'));
                        const tabMap = {
                            'vencimento': 'tabVencimento',
                            'tema': 'tabTema',
                            'vigentes': 'tabVigentes',
                            'encerrados': 'tabEncerrados'
                        };
                        const el = document.getElementById(tabMap[target]);
                        if (el) el.classList.add('active');
                        // Renderizar conteúdo específico
                        if (target === 'vencimento') {
                            renderMonthFilters();
                            aplicarFiltroVencimento('todos');
                        } else if (target === 'tema') {
                            renderTemas();
                        } else if (target === 'vigentes') {
                            const hoje = new Date();
                            hoje.setHours(0,0,0,0);
                            const vigentes = contratos.filter(c => c.vig_fim && new Date(c.vig_fim) >= hoje);
                            renderList('vigentesList', vigentes);
                        } else if (target === 'encerrados') {
                            const hoje = new Date();
                            hoje.setHours(0,0,0,0);
                            const encerrados = contratos.filter(c => c.vig_fim && new Date(c.vig_fim) < hoje);
                            renderList('encerradosList', encerrados);
                        }
                    });
                });
            }

            function renderTemas() {
                const container = document.getElementById('temaList');
                if (!container) return;
                const grupos = {};
                contratos.forEach(c => {
                    const tema = getTema(c.objeto);
                    if (!grupos[tema]) grupos[tema] = [];
                    grupos[tema].push(c);
                });
                container.innerHTML = '';
                for (const [tema, lista] of Object.entries(grupos)) {
                    const div = document.createElement('div');
                    div.className = 'tema-group';
                    const h3 = document.createElement('h3');
                    h3.textContent = `${tema} (${lista.length})`;
                    div.appendChild(h3);
                    const grid = document.createElement('div');
                    grid.className = 'contract-grid';
                    lista.forEach(c => {
                        const card = renderContractCard(c, true);
                        grid.appendChild(card);
                    });
                    div.appendChild(grid);
                    container.appendChild(div);
                }
                if (Object.keys(grupos).length === 0) {
                    container.innerHTML = '<div class="empty-state">Nenhum contrato para agrupar.</div>';
                }
            }

            // Modal Histórico
            function initModal() {
                const overlay = document.getElementById('modalOverlay');
                const close = document.getElementById('modalClose');
                const content = document.getElementById('modalContent');

                close.addEventListener('click', () => overlay.classList.remove('open'));
                overlay.addEventListener('click', (e) => {
                    if (e.target === overlay) overlay.classList.remove('open');
                });

                document.addEventListener('click', function(e) {
                    if (e.target.classList.contains('btn-detalhes')) {
                        const id = e.target.dataset.id;
                        const contrato = contratos.find(c => c.id == id);
                        if (!contrato) return;
                        const termosDoContrato = getTermosPorContrato(contrato.id_agrupado);
                        let html = `<h2>${contrato.empresa} - ${contrato.n_contrato}</h2>
                                    <p><strong>ID Agrupado:</strong> ${contrato.id_agrupado}</p>
                                    <p><strong>Objeto:</strong> ${contrato.objeto || 'Não informado'}</p>
                                    <p><strong>Processo SEI:</strong> ${contrato.processo || 'N/A'}</p>
                                    <p><strong>Tratativa:</strong> ${contrato.tratativa || 'Nenhuma'}</p>
                                    <h3 style="margin-top:20px;">Histórico de Vigências</h3>`;
                        // Contrato original
                        html += `<div class="historico-item">
                                    <div class="periodo">Original: ${contrato.vig_ini} a ${contrato.vig_fim}</div>
                                    <div class="detalhe">Meses: ${contrato.meses}</div>
                                </div>`;
                        // Aditivos
                        if (termosDoContrato.length) {
                            termosDoContrato.sort((a,b) => new Date(a.vig_ini) - new Date(b.vig_ini));
                            termosDoContrato.forEach(t => {
                                html += `<div class="historico-item">
                                            <div class="periodo">${t.n_termo} Termo: ${t.vig_ini} a ${t.vig_fim}</div>
                                            <div class="detalhe">${t.objeto} (Meses: ${t.meses})</div>
                                        </div>`;
                            });
                        } else {
                            html += `<p>Nenhum aditivo encontrado.</p>`;
                        }
                        content.innerHTML = html;
                        overlay.classList.add('open');
                    }
                });
            }

            // ============================================================
            // INICIALIZAÇÃO
            // ============================================================
            initTabs();
            initModal();
            // Carrega a aba Vencimento por padrão
            setTimeout(() => {
                renderMonthFilters();
                aplicarFiltroVencimento('todos');
            }, 100);

        });
    </script>
